name: ci

# Read-only quality checks for every push to main and every pull request.
# Packaging lives in electron-desktop.yml and stays manual; this workflow must
# not gain secrets, artifact uploads, or write permissions.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Ruff and Django tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: djdesk.settings.test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Django tests
        run: uv run --no-sync python manage.py test tests

  electron-guards:
    name: Electron guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run guard tests
        run: npm test
        working-directory: electron
